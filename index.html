<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiskers & Teacups</title>
  <style>
    /* --- Victorian Palette & Base Setup --- */
    :root {
      --antique-cream: #FFF9EF;
      --dusty-rose: #C98F91;
      --burgundy: #78434C;
      --sage-green: #7A8471;
      --warm-brown: #59453C;
      --antique-gold: #C5A36A;
    }

    body {
      background-color: #2C201A;
      color: var(--warm-brown);
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Main Game Window Frame */
    .game-container {
      width: 720px;
      height: 520px;
      background: var(--antique-cream);
      border: 4px solid var(--antique-gold);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Header HUD */
    .game-header {
      background: var(--burgundy);
      color: var(--antique-cream);
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--antique-gold);
      z-index: 10;
    }

    .status-hud {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
    }

    .nav-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .menu-btn {
      background: var(--antique-cream);
      color: var(--burgundy);
      border: 2px solid var(--antique-gold);
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s;
    }

    .menu-btn:hover {
      background: var(--antique-gold);
      color: #FFF;
    }

    /* Café Interior Stage */
    .cafe-interior {
      flex: 1;
      background: linear-gradient(180deg, #EAD9C2 0%, #D8C3A9 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
      overflow: hidden;
    }

    /* Background Room Layer */
    .room-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background-color: #3B2B24;
      border-bottom: 4px solid var(--antique-gold);
      padding: 1rem;
    }

    /* Scenic Window */
    .scenic-window {
      position: absolute;
      top: 15px;
      right: 40px;
      width: 80px;
      height: 120px;
      background: linear-gradient(135deg, #E2B2C1 0%, #C98F91 100%);
      border: 4px solid var(--warm-brown);
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    /* Chalkboard Sign */
    .chalkboard-sign {
      position: absolute;
      top: 20px;
      left: 30px;
      background: #241A16;
      border: 2px solid var(--antique-gold);
      padding: 0.5rem 1rem;
      color: var(--antique-cream);
      text-align: center;
      font-size: 0.8rem;
      border-radius: 4px;
    }
    .chalkboard-sign h3 { margin: 0; color: var(--antique-gold); font-size: 0.85rem; }
    .chalkboard-sign p { margin: 2px 0; }
    .chalkboard-sign .quote { font-size: 0.7rem; color: var(--dusty-rose); }

    /* Pastry Display Case */
    .pastry-display-case {
      position: absolute;
      bottom: -4px;
      right: 20px;
      width: 130px;
      height: 60px;
      background: rgba(255, 249, 239, 0.15);
      border: 2px solid var(--antique-gold);
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    /* Butlers Row */
    .butlers-row {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .butler-card {
      background: var(--antique-cream);
      border: 2px solid var(--antique-gold);
      border-radius: 8px;
      padding: 0.5rem;
      width: 100px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .pixel-sprite-box {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 234, 216, 0.5);
      border-radius: 4px;
      margin-bottom: 0.3rem;
    }

    .pixel-cat {
      width: 16px;
      height: 16px;
      transform: scale(2.5);
      image-rendering: pixelated;
    }

    .pixel-cat.oliver { box-shadow: 3px 3px 0 #9EAAA2, 6px 6px 0 #78434C; }
    .pixel-cat.miso { box-shadow: 3px 3px 0 #32231F, 6px 6px 0 #C98F91; }
    .pixel-cat.biscuit { box-shadow: 3px 3px 0 #AC573F, 6px 6px 0 #FFF9EF; }

    .nameplate strong {
      display: block;
      font-size: 0.8rem;
      color: var(--burgundy);
    }
    .nameplate span {
      font-size: 0.65rem;
      color: var(--warm-brown);
    }

    /* Foreground Floor */
    .cafe-floor-foreground {
      position: relative;
      z-index: 2;
      height: 40px;
      display: flex;
      align-items: center;
    }

    .cat-bed {
      background: rgba(89, 69, 60, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    /* Modal Popup Window */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(59, 43, 36, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background: var(--antique-cream);
      border: 4px solid var(--antique-gold);
      border-radius: 12px;
      width: 320px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--antique-gold);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      color: var(--burgundy);
      margin: 0;
    }

    .close-modal-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--warm-brown);
    }

    .modal-body {
      font-size: 0.9rem;
      color: var(--warm-brown);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Header HUD & Navigation -->
    <header class="game-header">
      <div class="status-hud">
        <span>Coins: <strong id="coin-count">150</strong></span>
        <span>Teacups: <strong id="teacup-count">12</strong></span>
        <span>Rep: <strong id="rep-count">1</strong></span>
      </div>
      <div class="nav-buttons">
        <button id="btn-recipes" class="menu-btn">Recipes</button>
        <button id="btn-decorate" class="menu-btn">Decorate</button>
        <button id="btn-cats" class="menu-btn">Collect Cats</button>
      </div>
    </header>

    <!-- Café Interior Room Stage -->
    <section class="cafe-interior">
      
      <!-- Background Room Layer -->
      <div class="room-background">
        <!-- Arched Window -->
        <div class="scenic-window"></div>

        <!-- Chalkboard Sign -->
        <div class="chalkboard-sign">
          <h3>Good Tea</h3>
          <p>Happy Cats</p>
          <span class="quote">A cozy life ♡</span>
        </div>

        <!-- Pastry Display Counter -->
        <div class="pastry-display-case">
          <span class="placeholder-pastry">🍰</span>
          <span class="placeholder-pastry">🧁</span>
        </div>
      </div>

      <!-- The Three Cat Butlers Counter Display -->
      <div class="butlers-row">
        <!-- Oliver -->
        <div class="butler-card">
          <div class="pixel-sprite-box">
            <div class="pixel-cat oliver" role="img" aria-label="Oliver pixel sprite"></div>
          </div>
          <div class="nameplate">
            <strong>Oliver</strong>
            <span>Head Butler ♡</span>
          </div>
        </div>

        <!-- Miso -->
        <div class="butler-card">
          <div class="pixel-sprite-box">
            <div class="pixel-cat miso" role="img" aria-label="Miso pixel sprite"></div>
          </div>
          <div class="nameplate">
            <strong>Miso</strong>
            <span>Tea Specialist ♡</span>
          </div>
        </div>

        <!-- Biscuit -->
        <div class="butler-card">
          <div class="pixel-sprite-box">
            <div class="pixel-cat biscuit" role="img" aria-label="Biscuit pixel sprite"></div>
          </div>
          <div class="nameplate">
            <strong>Biscuit</strong>
            <span>Pastry Butler ♡</span>
          </div>
        </div>
      </div>

      <!-- Foreground Floor -->
      <div class="cafe-floor-foreground">
        <div class="cat-bed">
          <span class="sleeping-cat">🐈 </span>
          <span class="zzr">Z z z</span>
        </div>
      </div>

    </section>
  </div>

  <script>
    // --- Game State & HUD ---
    const gameState = {
      coins: 150,
      teacups: 12,
      reputation: 1
    };

    function updateHUD() {
      document.getElementById('coin-count').textContent = gameState.coins;
      document.getElementById('teacup-count').textContent = gameState.teacups;
      document.getElementById('rep-count').textContent = gameState.reputation;
    }

    // --- Modal System ---
    function openModal(title, contentHtml) {
      let existingModal = document.getElementById('game-modal');
      if (existingModal) existingModal.remove();

      const modalOverlay = document.createElement('div');
      modalOverlay.id = 'game-modal';
      modalOverlay.className = 'modal-overlay';
      
      modalOverlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-header">
            <h2>${title}</h2>
            <button class="close-modal-btn" onclick="closeModal()">×</button>
          </div>
          <div class="modal-body">
            ${contentHtml}
          </div>
        </div>
      `;

      document.body.appendChild(modalOverlay);
    }

    function closeModal() {
      const modal = document.getElementById('game-modal');
      if (modal) modal.remove();
    }

    // --- Event Listeners ---
    document.addEventListener('DOMContentLoaded', () => {
      updateHUD();

      document.getElementById('btn-recipes').addEventListener('click', () => {
        openModal('The Recipe Book', `
          <p>Unlock cozy Victorian teas and pastries to serve your guests!</p>
          <ul>
            <li>🍵 <strong>Rose Oolong</strong> - Cost: 10 Coins (Unlocked)</li>
            <li>🍰 <strong>Earl Grey Madeleines</strong> - Cost: 25 Coins (Locked)</li>
          </ul>
        `);
      });

      document.getElementById('btn-decorate').addEventListener('click', () => {
        openModal('Café Decoration', `
          <p>Adorn your Victorian parlor with lace curtains and brass lamps.</p>
          <p><em>More furniture options coming soon!</em></p>
        `);
      });

      document.getElementById('btn-cats').addEventListener('click', () => {
        openModal('Resident Cat Lounge', `
          <p>Your sleepy feline companions:</p>
          <ul>
            <li>🐈 <strong>Muffin</strong> - Sleeping peacefully by the rug.</li>
          </ul>
        `);
      });
    });
  </script>
</body>
</html>
