<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiskers &amp; Teacups — Cat Café Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="game-viewport">
    <!-- Top Status Bar -->
    <header class="top-status-bar">
      <div class="resource-badge">
        <span class="icon">🐾</span>
        <span class="value">1,250</span>
        <button class="add-btn">+</button>
      </div>
      <div class="resource-badge">
        <span class="icon">🫖</span>
        <span class="value">25</span>
        <button class="add-btn">+</button>
      </div>
      <div class="level-badge">
        <span class="level-text">Lv. 1</span>
        <div class="exp-bar"><div class="exp-fill" style="width: 30%;"></div></div>
      </div>
    </header>

    <!-- Main Game Window Content -->
    <main class="cafe-stage">
      
      <!-- Left Navigation Menu -->
      <nav class="main-menu-panel">
        <div class="brand-header">
          <div class="ribbon-bow">🎀</div>
          <h1>Whiskers &amp; Teacups</h1>
          <p class="subtitle">♥ Cat Café ♥</p>
        </div>

        <ul class="menu-buttons">
          <li><button class="nav-btn active" data-action="play">▶ Play</button></li>
          <li><button class="nav-btn" data-action="decorate">🪑 Decorate</button></li>
          <li><button class="nav-btn" data-action="collect">🐾 Collect Cats</button></li>
          <li><button class="nav-btn" data-action="recipes">📖 Recipes</button></li>
          <li><button class="nav-btn" data-action="settings">⚙ Settings</button></li>
          <li><button class="nav-btn quit-btn" data-action="quit">🚪 Quit</button></li>
        </ul>
      </nav>

      <!-- Center Café Atmosphere & Butler Showcase -->
      <section class="cafe-interior">
        <div class="background-decor">
          <div class="chalkboard-sign">
            <h3>Good Tea</h3>
            <p>Happy Cats</p>
            <span class="quote">A cozy life ♡</span>
          </div>
        </div>

        <!-- The Three Cat Butlers Counter Display -->
        <div class="butlers-row">
          <!-- Oliver -->
          <div class="butler-card">
            <div class="sprite-container oliver-sprite">🐈‍⬛</div>
            <div class="nameplate">
              <strong>Oliver</strong>
              <span>Head Butler ♡</span>
            </div>
          </div>

          <!-- Miso -->
          <div class="butler-card">
            <div class="sprite-container miso-sprite">🐈‍⬛</div>
            <div class="nameplate">
              <strong>Miso</strong>
              <span>Tea Specialist ♡</span>
            </div>
          </div>

          <!-- Biscuit -->
          <div class="butler-card">
            <div class="sprite-container biscuit-sprite">🐈</div>
            <div class="nameplate">
              <strong>Biscuit</strong>
              <span>Pastry Butler ♡</span>
            </div>
          </div>
        </div>

        <!-- Foreground Resident Cat Sleeping Spot -->
        <div class="resident-cat-spot">
          <div class="cat-bed">
            <span class="sleeping-cat">🐈</span>
            <span class="zzr">Z z z</span>
          </div>
        </div>

      </section>

    </main>
  </div>

  <script>
    // Simple interactivity placeholder for menu buttons
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
